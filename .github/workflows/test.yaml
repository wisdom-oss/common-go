name: Run Unit Tests
on: ["push", "pull_request"]
jobs:
    test-gin:
        runs-on: ubuntu-latest
        steps:
            - uses: wisdom-oss/actions/go-test@main
              with:
                github-token: ${{ secrets.GITHUB_TOKEN }}

    test-stdlib:
        runs-on: ubuntu-latest
        steps:
            - uses: wisdom-oss/actions/go-test@main
              with:
                github-token: ${{ secrets.GITHUB_TOKEN }}
                build-flags: -tags=wisdom_stdlib